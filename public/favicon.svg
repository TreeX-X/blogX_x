<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>BlogX_x</title>
  <style>
    .tile { fill: #3e3425; }
    .cut { stroke: #efe5cf; fill: none; stroke-linecap: square; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #efe5cf; }
      .cut { stroke: #26201a; }
    }
  </style>
  <!-- 墨印：圆角墨印 R14，X 以负形刻痕（8.5 方端）。 -->
  <rect class="tile" x="2" y="2" width="60" height="60" rx="14"/>
  <g class="cut" stroke-width="8.5">
    <line x1="17" y1="17" x2="47" y2="47"/>
    <line x1="47" y1="17" x2="17" y2="47"/>
  </g>
</svg>
